<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-labelledby="title desc">
  <title id="title">World Diabetes Day</title>
  <desc id="desc">A blue awareness poster with a circular diabetes awareness symbol, a heart and glucose drop, and the message Know diabetes. Know your risk.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061C3A"/>
      <stop offset="1" stop-color="#0B4F91"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#62D5FF"/>
      <stop offset="1" stop-color="#1688E8"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#001329" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="1080" height="1080" fill="url(#bg)"/>
  <circle cx="920" cy="135" r="210" fill="#2A8BD0" opacity=".12"/>
  <circle cx="120" cy="940" r="260" fill="#2A8BD0" opacity=".10"/>
  <path d="M0 770 C230 690 330 900 570 820 S900 680 1080 760 V1080 H0Z" fill="#0A3B70" opacity=".55"/>

  <g opacity=".22" fill="none" stroke="#9ADFFF" stroke-width="3">
    <circle cx="160" cy="230" r="46"/><circle cx="160" cy="230" r="65"/>
    <circle cx="930" cy="800" r="35"/><circle cx="930" cy="800" r="54"/>
    <path d="M825 270h70m-35-35v70M165 700h60m-30-30v60"/>
  </g>

  <text x="540" y="105" text-anchor="middle" fill="#BCEBFF" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" letter-spacing="7">14 NOVEMBER</text>
  <text x="540" y="178" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800" letter-spacing="1">WORLD DIABETES</text>
  <text x="540" y="245" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="58" font-weight="800" letter-spacing="1">DAY</text>

  <g filter="url(#shadow)">
    <circle cx="540" cy="510" r="205" fill="none" stroke="#FFFFFF" stroke-width="27"/>
    <circle cx="540" cy="510" r="174" fill="#0B3C70" stroke="#62D5FF" stroke-width="4"/>
  </g>

  <!-- Heart and glucose drop symbol -->
  <path d="M540 627 C510 601 408 527 408 453 C408 397 451 365 496 365 C518 365 536 377 550 396 C565 377 585 365 608 365 C652 365 685 399 685 448 C685 522 584 601 540 627Z"
        fill="url(#blue)" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round"/>
  <path d="M548 425 C548 425 506 480 506 512 C506 539 524 558 548 558 C573 558 590 539 590 514 C590 482 548 425 548 425Z"
        fill="#FFFFFF" opacity=".98"/>
  <path d="M530 515 C533 529 543 536 556 536" fill="none" stroke="#1688E8" stroke-width="7" stroke-linecap="round"/>

  <text x="540" y="790" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="800">KNOW DIABETES.</text>
  <text x="540" y="846" text-anchor="middle" fill="#8FE0FF" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="800">KNOW YOUR RISK.</text>
  <text x="540" y="914" text-anchor="middle" fill="#E5F5FF" font-family="Arial, Helvetica, sans-serif" font-size="25">Check your blood sugar • Eat well • Stay active</text>

  <rect x="350" y="960" width="380" height="3" rx="2" fill="#74D9FF" opacity=".75"/>
  <text x="540" y="1015" text-anchor="middle" fill="#BCEBFF" font-family="Arial, Helvetica, sans-serif" font-size="19" letter-spacing="3">RAISE AWARENESS • TAKE ACTION</text>
</svg>